<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a0d08">
  <title>Ronnei na Veia — Sem conexão</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0a0a0a;color:#fff;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(420px,100%);text-align:center}
    img{width:72px;height:72px;object-fit:contain;margin-bottom:20px}
    h1{font-size:24px;margin:0 0 10px}
    p{color:rgba(255,255,255,.62);line-height:1.55;margin:0 0 24px}
    button{border:0;border-radius:12px;background:#ff4b1f;color:white;
      padding:13px 22px;font-weight:800;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/favicon.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>
      Assim que a internet voltar, tente novamente para continuar
      acessando seus cursos e materiais.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
